#cloud-config
# lam template "vllm": uv + a ~/venv with vLLM, HF token wired in, optional model prefetch.
# Vars from your shell at launch time:  HF_TOKEN (optional)  MODEL (optional, e.g. Qwen/Qwen3-0.6B)
# Lambda Stack already ships CUDA/driver/PyTorch system-wide; the venv gets vLLM's own pinned torch.
# Progress: lam logs      Done marker: ~/.lam-ready      Check: cat ~/.lam-vllm-check
package_update: true
packages: [tmux, htop, nvtop, rsync]
write_files:
  - path: /home/ubuntu/.hf_env
    owner: ubuntu:ubuntu
    permissions: "0600"
    content: |
      export HF_TOKEN="{{HF_TOKEN}}"
      export HUGGING_FACE_HUB_TOKEN="{{HF_TOKEN}}"
      export MODEL="{{MODEL}}"
runcmd:
  - sudo -u ubuntu -i bash -lc 'curl -LsSf https://astral.sh/uv/install.sh | sh'
  - sudo -u ubuntu -i bash -lc '~/.local/bin/uv venv ~/venv && ~/.local/bin/uv pip install --python ~/venv/bin/python "vllm>=0.28"'
  - sudo -u ubuntu -i bash -lc 'grep -q "source ~/venv/bin/activate" ~/.bashrc || printf "\n[ -f ~/.hf_env ] && source ~/.hf_env\nsource ~/venv/bin/activate\n" >> ~/.bashrc'
  - sudo -u ubuntu -i bash -lc 'source ~/.hf_env; if [ -n "$MODEL" ]; then ~/venv/bin/python -c "from huggingface_hub import snapshot_download; snapshot_download(\"$MODEL\")"; fi'
  - sudo -u ubuntu -i bash -lc '~/venv/bin/python -c "import vllm, torch; print(\"vllm\", vllm.__version__, \"torch\", torch.__version__, \"cuda\", torch.cuda.is_available(), torch.cuda.get_device_name(0) if torch.cuda.is_available() else \"\")" > ~/.lam-vllm-check 2>&1'
  - touch /home/ubuntu/.lam-ready && chown ubuntu:ubuntu /home/ubuntu/.lam-ready
final_message: "lam vllm: cloud-init finished after $UPTIME s"
